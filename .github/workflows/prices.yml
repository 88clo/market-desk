name: Refresh prices
on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # every 30 minutes, about 8:30 AM to 4:30 PM New York time (UTC)
    - cron: '45 21 * * 1-5'        # once more after the close
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_prices.py
      - run: |
          git config user.name "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Refresh prices" && git push)
